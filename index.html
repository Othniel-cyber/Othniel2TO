<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Othniel2TO - Dactylographie</title>
<meta name="description" content="Apprenez à taper plus vite au clavier avec Othniel2TO">
<meta name="theme-color" content="#6c63ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f5;
  --fg:#1a1a1a;
  --accent:#6c63ff;
  --accent2:#4a90d9;
  --success:#2ecc71;
  --error:#e74c3c;
  --card:#fff;
  --card2:#f0f0f0;
  --border:#e0e0e0;
  --text2:#666;
  --text3:#999;
  --key-bg:#fff;
  --key-border:#ccc;
  --key-pressed:#6c63ff;
  --text-bg:#fafafa;
  --text-correct:#2ecc71;
  --text-incorrect:#e74c3c;
  --text-current:#f1c40f;
  --text-future:#888;
  --shadow:0 4px 24px rgba(0,0,0,.06);
  --shadow-h:0 8px 32px rgba(0,0,0,.1);
  --gold:#c9a84c;
  --ivory:#faf6f0;
  --dark-text:#2c2c2c;
}
.dark{
  --bg:#1a1a2e;
  --fg:#eaeaea;
  --accent:#6c63ff;
  --accent2:#4a90d9;
  --success:#2ecc71;
  --error:#e74c3c;
  --card:#16213e;
  --card2:#0f3460;
  --border:#0f3460;
  --text2:#aaa;
  --text3:#7f8c8d;
  --key-bg:#16213e;
  --key-border:#0f3460;
  --key-pressed:#6c63ff;
  --text-bg:#0f3460;
  --text-correct:#2ecc71;
  --text-incorrect:#e74c3c;
  --text-current:#f39c12;
  --text-future:#7f8c8d;
  --shadow:0 4px 24px rgba(0,0,0,.2);
  --shadow-h:0 8px 32px rgba(0,0,0,.3);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--fg);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.page{display:none;min-height:100vh;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;border:none;text-decoration:none;transition:all .3s;font-family:'Inter',sans-serif}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,99,255,.3)}
.btn-secondary{background:var(--card2);color:var(--fg)}
.btn-secondary:hover{transform:translateY(-2px)}
.btn-outline{border:2px solid var(--accent);color:var(--accent);background:transparent}
.btn-outline:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}
.btn-sm{padding:8px 18px;font-size:13px}
input,select,textarea{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;background:var(--card);color:var(--fg);font-family:'Inter',sans-serif;transition:all .3s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.12)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--text2)}
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.navbar{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--card);padding:0 5%;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.navbar .logo{display:flex;align-items:center;gap:8px;font-size:1.2rem;font-weight:800;color:var(--accent);text-decoration:none}
.navbar .logo span{color:var(--accent2)}
.navbar .nav-right{display:flex;align-items:center;gap:8px}
.navbar .nav-link{background:none;border:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;padding:8px 14px;border-radius:8px;transition:all .2s}
.navbar .nav-link:hover{color:var(--accent);background:var(--card2)}
.navbar .nav-link.primary{background:var(--accent);color:#fff;font-weight:600}
.navbar .nav-link.primary:hover{background:#5a52d5}
.icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:100%;height:100%;fill:currentColor}
.icon-lg{width:32px;height:32px}
.icon-xl{width:48px;height:48px}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 5% 40px;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,rgba(108,99,255,.1),transparent 60%),radial-gradient(circle at 70% 50%,rgba(74,144,217,.05),transparent 60%)}
.hero h1{font-size:clamp(2rem,6vw,3.5rem);color:#fff;margin-bottom:6px;line-height:1.15}
.hero h1 .hl{color:var(--accent)}
.hero .subtitle{color:rgba(255,255,255,.7);font-size:clamp(1rem,2.5vw,1.2rem);margin-bottom:8px;font-weight:300}
.hero p{color:rgba(255,255,255,.5);font-size:clamp(.9rem,1.8vw,1rem);max-width:600px;margin:0 auto 32px;line-height:1.8}
.section{padding:64px 5%}
.section-title{font-size:clamp(1.5rem,4vw,2rem);color:var(--accent);text-align:center;margin-bottom:6px;font-weight:800}
.section-subtitle{color:var(--text2);text-align:center;margin-bottom:32px;font-size:14px}

/* DASHBOARD */
.dash-layout{display:flex;height:100vh;overflow:hidden}
.dash-side{width:230px;background:var(--card);padding:0;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column}
.dash-user{padding:20px;text-align:center;border-bottom:1px solid var(--border)}
.dash-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;background:var(--accent);color:#fff;font-size:1.4rem;font-weight:700}
.dash-name{font-size:14px;font-weight:700;color:var(--fg)}
.dash-info{font-size:11px;color:var(--text3);margin-top:2px}
.dash-menu{padding:12px;flex:1;list-style:none}
.dash-menu li{margin:2px 0}
.dash-menu a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:500;transition:all .2s;cursor:pointer}
.dash-menu a:hover{background:var(--card2);color:var(--fg)}
.dash-menu a.active{background:rgba(108,99,255,.1);color:var(--accent);font-weight:600}
.dash-menu a svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}
.dash-main{flex:1;padding:32px 5%;overflow-y:auto;background:var(--bg)}
.dash-main h2{font-size:1.4rem;color:var(--accent);margin-bottom:4px}
.dash-main .dm-sub{color:var(--text2);font-size:14px;margin-bottom:24px}

/* TYPING */
.typing-area{background:var(--card);border-radius:14px;padding:24px;margin-bottom:16px;border:1px solid var(--border);box-shadow:var(--shadow);min-height:120px;font-family:'JetBrains Mono',monospace;font-size:20px;line-height:1.8;letter-spacing:1px;position:relative}
.typing-area .char{transition:color .1s}
.typing-area .char.correct{color:var(--text-correct)}
.typing-area .char.incorrect{color:var(--text-incorrect);background:rgba(231,76,60,.15);border-radius:2px}
.typing-area .char.current{color:var(--text-current);text-decoration:underline;text-decoration-color:var(--text-current)}
.typing-area .char.future{color:var(--text-future)}
.typing-area .char.done{color:var(--text-correct)}
.typing-area .cursor{display:inline-block;width:2px;height:24px;background:var(--accent);animation:blink 1s infinite;vertical-align:middle;margin-left:1px}

/* VIRTUAL KEYBOARD */
.vkeyboard{max-width:750px;margin:0 auto;padding:8px;user-select:none}
.vkey-row{display:flex;justify-content:center;gap:4px;margin-bottom:4px}
.vkey{display:flex;align-items:center;justify-content:center;height:44px;background:var(--key-bg);border:1px solid var(--key-border);border-radius:6px;font-size:12px;font-weight:500;color:var(--fg);transition:all .08s;cursor:default;min-width:38px;font-family:'Inter',sans-serif}
.vkey.pressed{background:var(--key-pressed);color:#fff;transform:scale(.95);border-color:var(--key-pressed)}
.vkey.special{min-width:56px;font-size:10px;color:var(--text3)}
.vkey.space{min-width:220px}
.vkey.wide{min-width:52px}

/* STATS BAR */
.stats-bar{display:flex;justify-content:center;gap:24px;padding:12px 20px;background:var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-item .si-val{font-size:1.5rem;font-weight:800;color:var(--accent)}
.stat-item .si-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* PROGRESS */
.progress-wrap{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .3s ease;width:0%}

/* GRID CARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);transition:all .3s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.card .card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:rgba(108,99,255,.1)}
.card .card-icon svg{width:22px;height:22px;fill:var(--accent)}
.card h4{font-size:14px;color:var(--fg);margin-bottom:2px}
.card .card-desc{font-size:12px;color:var(--text3);margin-top:4px}
.card .card-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;font-weight:600;margin-top:8px}

/* LESSONS */
.lesson-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.lesson-item{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);transition:all .3s;cursor:pointer}
.lesson-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.lesson-item.locked{opacity:.5;cursor:not-allowed}
.lesson-item.locked:hover{transform:none}
.lesson-item .li-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lesson-item .li-head h4{font-size:14px;color:var(--fg)}
.lesson-item .li-head .li-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.lesson-item .li-desc{font-size:12px;color:var(--text3)}
.lesson-item .li-stats{font-size:11px;color:var(--text2);margin-top:6px;display:flex;gap:12px}

/* RESULT */
.result-box{max-width:500px;margin:0 auto;background:var(--card);border-radius:16px;padding:32px;border:1px solid var(--border);box-shadow:var(--shadow);text-align:center}
.result-box .rb-grade{font-size:3rem;font-weight:800;color:var(--accent)}
.result-box .rb-grade-label{font-size:14px;color:var(--text2);margin-bottom:16px}
.result-box .rb-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.result-box .rb-stat{padding:12px;background:var(--card2);border-radius:10px}
.result-box .rb-stat .rbs-val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.result-box .rb-stat .rbs-lbl{font-size:11px;color:var(--text3)}

/* SETTINGS */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.settings-row .sr-label{font-size:14px;color:var(--fg)}
.settings-row .sr-desc{font-size:12px;color:var(--text3)}

/* RESPONSIVE */
@media(max-width:768px){
  .dash-layout{flex-direction:column}
  .dash-side{width:100%;border-right:none;border-bottom:1px solid var(--border)}
  .dash-user{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px}
  .dash-avatar{margin:0;width:40px;height:40px;font-size:1rem}
  .dash-menu{display:flex;padding:8px 12px;overflow-x:auto;gap:4px}
  .dash-menu li{margin:0;flex-shrink:0}
  .dash-menu a{padding:8px 12px;font-size:12px;white-space:nowrap}
  .dash-main{padding:20px 16px}
  .form-row{grid-template-columns:1fr}
  .section{padding:40px 5%}
  .vkey{height:36px;min-width:30px;font-size:10px}
  .vkey.space{min-width:160px}
  .vkey.special{min-width:44px}
  .vkey.wide{min-width:42px}
  .typing-area{font-size:16px;padding:16px}
  .stats-bar{gap:12px}
  .stat-item .si-val{font-size:1.2rem}
}
@media(max-width:480px){
  .navbar{height:52px}
  .hero{padding:60px 5% 30px}
  .btn{padding:10px 20px;font-size:14px}
  .vkey{height:32px;min-width:26px;font-size:9px}
  .vkey.space{min-width:120px}
  .vkey.special{min-width:36px}
  .vkey.wide{min-width:36px}
}
.certificate-wrap{max-width:800px;margin:0 auto;background:var(--ivory);border:3px solid var(--gold);border-radius:16px;padding:48px;position:relative;overflow:hidden;box-shadow:0 8px 48px rgba(201,168,76,.15),0 2px 8px rgba(0,0,0,.08);font-family:'Inter',sans-serif;color:var(--dark-text)}
.certificate-wrap::before{content:'';position:absolute;inset:10px;border:2px solid var(--gold);border-radius:12px;pointer-events:none;opacity:.5}
.certificate-wrap::after{content:'✦ ✦ ✦';position:absolute;top:16px;right:24px;font-size:12px;letter-spacing:6px;color:var(--gold);opacity:.4;pointer-events:none}
.certificate-wrap .cw-header{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:20px;margin-bottom:24px;position:relative}
.certificate-wrap .cw-header h2{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:800;color:var(--gold);margin:0;letter-spacing:1px}
.certificate-wrap .cw-header .cw-badge{display:inline-block;background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:3px 16px;border-radius:20px;text-transform:uppercase;letter-spacing:2px;margin-top:8px}
.certificate-wrap .cw-header p{color:#888;font-size:13px;margin-top:4px}
.certificate-wrap .cw-body{display:flex;gap:28px;align-items:start}
.certificate-wrap .cw-photo{width:130px;height:150px;border:3px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:var(--card2);position:relative;box-shadow:0 2px 12px rgba(201,168,76,.2)}
.certificate-wrap .cw-photo img{width:100%;height:100%;object-fit:cover}
.certificate-wrap .cw-photo .placeholder{font-size:2.5rem;color:var(--text3);text-align:center}
.certificate-wrap .cw-info{flex:1}
.certificate-wrap .cw-info .field{margin-bottom:10px}
.certificate-wrap .cw-info .field label{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.certificate-wrap .cw-info .field .val{font-size:15px;font-weight:600;color:var(--dark-text);padding:6px 0;border-bottom:1px solid #e8dcc8}
.certificate-wrap .cw-seal{text-align:center;margin:24px 0 12px}
.certificate-wrap .cw-seal .seal-circle{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#b8922e);display:flex;align-items:center;justify-content:center;margin:0 auto;color:#fff;font-size:1.2rem;font-weight:800;box-shadow:0 2px 12px rgba(201,168,76,.3)}
.certificate-wrap .cw-footer{display:flex;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:2px solid var(--gold);position:relative}
.certificate-wrap .cw-footer .signature{text-align:center;min-width:160px}
.certificate-wrap .cw-footer .signature .sig-line{width:160px;height:2px;background:var(--gold);margin:4px auto}
.certificate-wrap .cw-footer .signature .sig-name{font-size:13px;font-weight:700;color:var(--dark-text);font-family:'Playfair Display',serif}
.certificate-wrap .cw-footer .signature .sig-title{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.certificate-wrap .cw-number{text-align:center;margin-top:16px;font-size:11px;color:var(--text3);letter-spacing:2px}
.d-none{display:none!important}
.text-center{text-align:center}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.mb-16{margin-bottom:16px}
.flex{display:flex}
.flex-wrap{flex-wrap:wrap}
.gap-8{gap:8px}
.items-center{align-items:center}
input[type="date"]{appearance:auto;-webkit-appearance:auto}
</style>
</head>

function getRandomText(lang,diff){
  const t=TEXTS[lang]&&TEXTS[lang][diff]?TEXTS[lang][diff]:TEXTS.francais.debutant;
  return t[Math.floor(Math.random()*t.length)]
}

function generateLessonText(lesson){
  const keys=lesson.keys;if(!keys)return getRandomText("francais",lesson.diff);
  const words=[];for(let i=0;i<6;i++){let w="";const l=2+Math.floor(Math.random()*4);for(let j=0;j<l;j++)w+=keys[Math.floor(Math.random()*keys.length)];words.push(w)}
  return words.join(" ")
}

function getGrade(wpm){
  if(wpm>=90)return"Légende";if(wpm>=75)return"Expert";if(wpm>=60)return"Avancé";
  if(wpm>=45)return"Intermédiaire";if(wpm>=30)return"Débutant";return"Débutant"
}

function getProgress(userId){
  try{return JSON.parse(localStorage.getItem('oth_progress_'+userId)||'{}')}catch(e){return{lessons:{},examPassed:false,examProgress:{}}}
}

function saveProgress(userId,data){
  localStorage.setItem('oth_progress_'+userId,JSON.stringify(data))
}

function getSessions(userId){
  try{return JSON.parse(localStorage.getItem('oth_sessions_'+userId)||'[]')}catch(e){return[]}
}

function addSession(userId,session){
  const sessions=getSessions(userId);sessions.unshift(session);
  if(sessions.length>200)sessions.pop();
  localStorage.setItem('oth_sessions_'+userId,JSON.stringify(sessions))
}

function getAvgWpm(userId){
  const s=getSessions(userId);if(!s.length)return 0;
  return Math.round(s.reduce((a,b)=>a+(b.wpm||0),0)/s.length*10)/10
}

function getAvgAcc(userId){
  const s=getSessions(userId);if(!s.length)return 0;
  return Math.round(s.reduce((a,b)=>a+(b.accuracy||0),0)/s.length*10)/10
}

function getBestWpm(userId){
  const s=getSessions(userId);if(!s.length)return 0;
  return Math.round(Math.max(...s.map(x=>x.wpm||0))*10)/10
}

function getTotalTime(userId){
  const s=getSessions(userId);return Math.round(s.reduce((a,b)=>a+(b.elapsed||0),0))
}

    </div>`
}

function dashTyping(c,u){
  const lang=currentUser&&currentUser.language?currentUser.language:'francais';
  const diff=document.getElementById('typingDiff')?document.getElementById('typingDiff').value:'debutant';
  const text=getRandomText(lang,diff);

    <div class="vkeyboard" id="vkeyboard"></div>
    <p style="text-align:center;font-size:12px;color:var(--text3);margin-top:8px">Clique sur la zone de texte puis tape pour commencer</p>`;

function refreshText(){
  const lang=document.getElementById('typingLang').value;
  const diff=document.getElementById('typingDiff').value;
  if(currentUser){currentUser.language=lang;localStorage.setItem('oth_guest_user',JSON.stringify(currentUser))}
  const text=getRandomText(lang,diff);
  initTyping(text,document.getElementById('dashContent'))
}

function initTyping(text,container){
  typingEngine={text:text,pos:0,typed:0,correct:0,errors:0,keystrokes:0,startTime:null,isRunning:false,finished:false,history:[]};
  const area=document.getElementById('typingArea');if(!area)return;
  let h='';for(let i=0;i<text.length;i++){const c=text[i];h+=`<span class="char ${i===0?'current':'future'}" data-i="${i}">${c===' '?'\u00A0':c}</span>`}
  area.innerHTML=h+'<span class="cursor"></span>';
  document.getElementById('progressFill').style.width='0%';
  focusTyping()
}

function focusTyping(){const a=document.getElementById('typingArea');if(a)a.focus()}

document.addEventListener('keydown',function(e){
  if(!typingEngine||typingEngine.finished||!document.getElementById('typingArea'))return;
  const area=document.getElementById('typingArea');
  if(!area||!area.closest('.page.active')||!area.closest('#dashContent'))return;
  if(e.key==='Backspace'||e.key==='Delete'||e.key==='Tab'||e.key==='Escape')return;
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  e.preventDefault();
  const eng=typingEngine;
  if(!eng.startTime){eng.startTime=Date.now();eng.isRunning=true}
  if(eng.pos>=eng.text.length)return;
  const char=e.key;eng.keystrokes++;
  const expected=eng.text[eng.pos];
  const correct=char===expected;
  if(correct)eng.correct++;else eng.errors++;
  eng.typed++;
  const chars=area.querySelectorAll('.char');
  if(chars[eng.pos]){chars[eng.pos].className='char '+(correct?'correct':'incorrect')}
  eng.pos++;
  if(eng.pos<chars.length){chars[eng.pos].className='char current'}
  eng.history.push({pos:eng.pos-1,expected,typed:char,correct,wpm:calcWpm(eng),accuracy:calcAcc(eng)});
  const cursor=area.querySelector('.cursor');
  if(eng.pos<chars.length){area.appendChild(cursor)}
  const pct=Math.round((eng.pos/eng.text.length)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('stwpm').textContent=calcWpm(eng);
  document.getElementById('stacc').textContent=calcAcc(eng)+'%';
  document.getElementById('sttime').textContent=Math.floor((Date.now()-eng.startTime)/1000)+'s';
  document.getElementById('sterr').textContent=eng.errors;
  const k=document.querySelector('.vkey[data-key="'+char.toLowerCase()+'"]');
  if(k){k.classList.add('pressed');setTimeout(()=>k.classList.remove('pressed'),120)}
  if(eng.pos>=eng.text.length){finishTyping(eng)}
});

function calcWpm(eng){
  if(!eng.startTime||!eng.isRunning)return 0;
  const elapsed=(Date.now()-eng.startTime)/60000;
  if(elapsed<=0)return 0;
  return Math.round((eng.correct/5)/elapsed)
}

function calcAcc(eng){
  if(eng.keystrokes<=0)return 100;
  return Math.round((eng.correct/eng.keystrokes)*100)
}

function finishTyping(eng){
  eng.finished=true;eng.isRunning=false;
  const wpm=calcWpm(eng);const acc=calcAcc(eng);
  const elapsed=Math.round((Date.now()-eng.startTime)/1000);
  const grade=getGrade(wpm);
  const results={wpm,accuracy:acc,elapsed,errors:eng.errors,typed:eng.typed,correct:eng.correct,keystrokes:eng.keystrokes,targetLength:eng.text.length,grade:grade};
  if(currentUser){addSession(currentUser.id,{...results,date:new Date().toISOString(),mode:'libre'})}
  if(currentLessonId){
    const prog=getProgress(currentUser.id);
    if(!prog.lessons)prog.lessons={};
    if(!prog.lessons[currentLessonId])prog.lessons[currentLessonId]={};
    const prev=prog.lessons[currentLessonId];
    if(!prev.completed||(prev.bestWpm||0)<wpm||(prev.bestAcc||0)<acc){
      prog.lessons[currentLessonId]={completed:true,bestWpm:Math.max(prev.bestWpm||0,wpm),bestAcc:Math.max(prev.bestAcc||0,acc),unlocked:true};
      const nextId=currentLessonId+1;
      if(nextId<=15&&!prog.lessons[nextId])prog.lessons[nextId]={unlocked:true,completed:false,bestWpm:0,bestAcc:0};
    }
    saveProgress(currentUser.id,prog);
    currentLessonId=null
  }
  if(currentExamId){
    const prog=getProgress(currentUser.id);
    if(!prog.examProgress)prog.examProgress={};
    if(acc>=80){
      if(!prog.examProgress[currentExamId]||(prog.examProgress[currentExamId].bestWpm||0)<wpm)
        prog.examProgress[currentExamId]={completed:true,bestWpm:wpm,bestAcc:acc};
      const nextId=currentExamId+1;
      if(nextId<=5&&!prog.examProgress[nextId])prog.examProgress[nextId]={unlocked:true};
    }
    if(Object.keys(prog.examProgress).filter(k=>prog.examProgress[k].completed).length>=5)prog.examPassed=true;
    saveProgress(currentUser.id,prog);
    currentExamId=null
  }
  showResults(results)
}

// VIRTUAL KEYBOARD
const KEYBOARD_ROWS=[
  ['a','z','e','r','t','y','u','i','o','p','^','$'],
  ['q','s','d','f','g','h','j','k','l','m','ù','*'],
  ['>','w','x','c','v','b','n',',',';',':','!'],
  [' ',' ',' ',' ',' ',' ',' ',' ',' ',' ']
];

function renderKeyboard(){
  const kb=document.getElementById('vkeyboard');if(!kb)return;
  let h='';
  KEYBOARD_ROWS.forEach((row,i)=>{
    h+='<div class="vkey-row">';
    if(i===3)h+=`<div class="vkey special" style="min-width:56px">Ctrl</div>`;
    row.forEach(k=>{
      if(k===' '){h+=`<div class="vkey space" data-key=" "></div>`;return}
      if(k==='>'||k==='<'){h+=`<div class="vkey special" style="min-width:44px">${k==='>'?'Shift':k==='<'?'Ver':' '}</div>`;return}
      h+=`<div class="vkey" data-key="${k}">${k}</div>`
    });
    if(i===3)h+=`<div class="vkey special" style="min-width:56px">Alt</div>`;
    h+='</div>'
  });
  kb.innerHTML=h
}

// LESSONS
function dashLessons(c,u){
  const prog=getProgress(u.id);
  let h=`<h2>Leçons</h2><p class="dm-sub">15 leçons progressives pour maîtriser le clavier</p><div class="lesson-list">`;
  LESSONS.forEach(l=>{
    const data=prog.lessons&&prog.lessons[l.id];
    const unlocked=!data||data.unlocked;
    const completed=data&&data.completed;
    const locked=!unlocked;
    const bwpm=data&&data.bestWpm?data.bestWpm:0;
    const bacc=data&&data.bestAcc?data.bestAcc:0;
    const badge=l.diff==='debutant'?'var(--success)':l.diff==='intermediaire'?'var(--accent)':'var(--error)';
    h+=`<div class="lesson-item${locked?' locked':''}" onclick="${locked?'':"startLesson("+l.id+")"}">
      <div class="li-head"><h4>${l.id}. ${l.name}</h4><span class="li-badge" style="background:${badge}15;color:${badge}">${l.diff}</span></div>
      <div class="li-desc">${l.desc}</div>
      <div class="li-stats">${completed?'✅ Complétée':'📝 '+(unlocked?'Prête':'🔒 Verrouillée')} ${bwpm?'| '+bwpm+' WPM':''} ${bacc?'| '+bacc+'%':''}</div>
    </div>`
  });
  h+='</div>';c.innerHTML=h
}

function startLesson(id){
  const lesson=LESSONS.find(l=>l.id===id);if(!lesson)return;
  currentLessonId=id;currentExamId=null;
  const text=generateLessonText(lesson);
  const c=document.getElementById('dashContent');
  c.innerHTML=`<h2>Leçon ${id} : ${lesson.name}</h2><p class="dm-sub">${lesson.desc}</p>
    <div class="stats-bar">
      <div class="stat-item"><div class="si-val" id="stwpm">0</div><div class="si-lbl">WPM</div></div>

// EXAM
function dashExam(c,u){
  const prog=getProgress(u.id);
  const passed=prog.examPassed;
  let h=`<h2>Examen de dactylographie</h2><p class="dm-sub">${passed?'✅ Félicitations ! Tu as réussi l\'examen !':'5 exercices à valider (80% de précision requis)'}</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">`;
  EXAMS.forEach(ex=>{
    const data=prog.examProgress&&prog.examProgress[ex.id];
    const completed=data&&data.completed;
    const unlock=data&&(data.unlocked||ex.id===1)||ex.id===1;
    h+=`<div class="card${!unlock?' locked':''}" onclick="${unlock?`startExam(${ex.id})`:''}" style="${!unlock?'opacity:.5;cursor:not-allowed':''}">
      <div class="card-icon" style="background:rgba(108,99,255,.1)"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
      <h4>${ex.id}. ${ex.name}</h4><p class="card-desc">${ex.desc}</p>
      <div class="card-badge" style="background:${completed?'rgba(46,204,113,.15)':'rgba(108,99,255,.1)'};color:${completed?'var(--success)':'var(--accent)'}">${completed?'✅ Réussi':'⏳ '+(unlock?'Prêt':'🔒')}</div>
      ${data&&data.bestWpm?`<div style="font-size:11px;color:var(--text3);margin-top:4px">Meilleur: ${data.bestWpm} WPM | ${data.bestAcc}%</div>`:''}
    </div>`
  });
  h+='</div>';c.innerHTML=h
}

function setCertData(userId,data){
  localStorage.setItem('oth_cert_data_'+userId,JSON.stringify(data))
}

function submitCertInfo(e){
  e.preventDefault();
  if(!currentUser)return;
  const nom=document.getElementById('certNom').value.trim();
  const prenom=document.getElementById('certPrenom').value.trim();
  const birth=document.getElementById('certBirth').value;
  if(!nom||!prenom||!birth){alert('Tous les champs sont requis');return}
  setCertData(currentUser.id,{nom,prenom,birth,obtention:new Date().toISOString()});
  const fileInp=document.getElementById('certPhotoInputForm');
  if(fileInp&&fileInp.files&&fileInp.files[0]){
    const reader=new FileReader();
    reader.onload=function(ev){
      localStorage.setItem('oth_cert_photo_'+currentUser.id,ev.target.result);
      showDash('certificate')
    };
    reader.readAsDataURL(fileInp.files[0])
  }else{
    showDash('certificate')
  }
}

function handleCertPhotoForm(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const preview=document.getElementById('certPhotoPreview');
    const img=document.getElementById('certPhotoPreviewImg');
    img.src=ev.target.result;
    preview.style.display='block'
  };
  reader.readAsDataURL(file)
}

function resetCertInfo(){
  if(currentUser){
    localStorage.removeItem('oth_cert_data_'+currentUser.id);
    localStorage.removeItem('oth_cert_photo_'+currentUser.id)
  }
  showDash('certificate')
}

function saveCertificate(){
  const container=document.getElementById('certContainer');
  if(!container)return;
  const nom=(document.querySelector('#certContainer .cw-info .field:first-child .val')||{}).textContent||'Etudiant';
  const btn=document.querySelector('#dashContent .btn-primary');
  if(btn){btn.textContent='⏳ Génération...';btn.disabled=true}
  const clone=container.cloneNode(true);
  clone.style.position='fixed';clone.style.top='-9999px';clone.style.left='-9999px';
  clone.style.width='800px';clone.style.zIndex='-1';
  document.body.appendChild(clone);
  const btns=clone.querySelectorAll('.btn');btns.forEach(b=>b.style.display='none');
  const fileInp=clone.querySelector('input[type="file"]');if(fileInp)fileInp.style.display='none';
  const ph=clone.querySelector('.placeholder');if(ph)ph.style.display='none';
  const img=clone.querySelector('img');
  if(img&&!img.src){img.style.display='none'}
  html2canvas(clone,{scale:2,useCORS:true,backgroundColor:'#faf6f0',allowTaint:false}).then(canvas=>{
    const link=document.createElement('a');
    link.download='Attestation_CodeLux_'+nom.replace(/\s/g,'_')+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    document.body.removeChild(clone);
    if(btn){btn.textContent='💾 Télécharger l\'attestation';btn.disabled=false}
  }).catch(()=>{
    document.body.removeChild(clone);
    if(btn){btn.textContent='💾 Télécharger l\'attestation';btn.disabled=false}
    alert("Erreur lors de la génération de l'image. Essaie avec un navigateur récent.")
  })
}

  const s=getSessions(u.id);

  const avgAcc=getAvgAcc(u.id);
  const total=getTotalTime(u.id);
  let historyH='';
  if(s.length===0){
    historyH='<p style="color:var(--text3);text-align:center;padding:20px">Aucune session pour le moment. Fais ta première séance de dactylo !</p>'
  }else{
    historyH=s.slice(0,20).map((ss,i)=>`<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px">
      <span style="color:var(--text3);min-width:70px">${ss.date?new Date(ss.date).toLocaleDateString():'#'+(s.length-i)}</span>
      <span style="font-weight:600;color:var(--accent);min-width:50px">${ss.wpm} WPM</span>
      <span style="color:var(--text-correct);min-width:50px">${ss.accuracy}%</span>
      <span style="color:var(--text3)">${ss.errors} err.</span>
      <span style="color:var(--text3)">${ss.elapsed}s</span>
      <span style="color:var(--text2)">${ss.mode||'libre'}</span>
    </div>`).join('')
  }
  c.innerHTML=`<h2>Statistiques</h2><p class="dm-sub">Ta progression dans le temps</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px">
      <div style="background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border)"><div style="font-size:1.8rem;font-weight:800;color:var(--accent)">${avg}</div><div style="font-size:11px;color:var(--text3)">WPM Moyen</div></div>
      <div style="background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border)"><div style="font-size:1.8rem;font-weight:800;color:var(--accent)">${best}</div><div style="font-size:11px;color:var(--text3)">Meilleur WPM</div></div>
      <div style="background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border)"><div style="font-size:1.8rem;font-weight:800;color:var(--accent)">${avgAcc}%</div><div style="font-size:11px;color:var(--text3)">Précision moy.</div></div>
      <div style="background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border)"><div style="font-size:1.8rem;font-weight:800;color:var(--accent)">${s.length}</div><div style="font-size:11px;color:var(--text3)">Sessions</div></div>
    </div>
    <h3 style="font-size:14px;color:var(--fg);margin-bottom:8px">Historique des sessions</h3>
    ${historyH}`
}

function saveSetting(key,val){
  if(!currentUser)return;
  currentUser[key]=val;
  localStorage.setItem('oth_guest_user',JSON.stringify(currentUser));
  if(key==='theme'){document.body.classList.toggle('dark',val==='dark')}
}

// PWA INSTALL
let deferredPrompt=null;
try {
if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true){
  document.getElementById('installBtn').style.display='none'
}else{
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='inline-flex'
  });
  window.addEventListener('appinstalled',()=>{
    deferredPrompt=null;
    const btn=document.getElementById('installBtn');
    if(btn)btn.style.display='none'
  })
}
} catch(e){}
function installApp(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{
    deferredPrompt=null;
    document.getElementById('installBtn').style.display='none'
  })
}
